[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "znet"
version = "0.1.0"
dependencies = [
    "torch",
    "numpy",
    "pandas",
    "matplotlib",
    "plotly",
    "nbformat"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["znet*", "thermograph*"]
